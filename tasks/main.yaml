---
- name: Determine install method
  block:
    - name: Set install method for amd64 architectures using apt
      when: onepassword_install_method == "" and ansible_facts['pkg_mgr'] == "apt" and ansible_facts['architecture'] == "x86_64"
      ansible.builtin.set_fact:
        onepassword_install_method: apt

    - name: Set install method for other linux distributions or arm
      when: onepassword_install_method == "" and ansible_facts['architecture'] in ["x86_64", "aarch64"]
      ansible.builtin.set_fact:
        onepassword_install_method: linux-other

- debug:
    var: onepassword_install_method

- ansible.builtin.include_tasks: install.{{ onepassword_install_method }}.yaml
