---
- name: Setup 1password apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: 1password
    types: deb
    uris: https://downloads.1password.com/linux/debian/amd64
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://downloads.1password.com/linux/keys/1password.asc
  notify:
    - Update apt cache

- ansible.builtin.meta: flush_handlers

- name: Install 1password desktop app
  become: true
  ansible.builtin.apt:
    name: 1password
    state: "{{ onepassword_apps_apt_state }}"
