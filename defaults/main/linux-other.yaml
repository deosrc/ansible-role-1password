---
## Values in this file are only applicable to the "linux-other" install method.

# If true, forces the 1password desktop app to be updated.
# If false, 1password desktop will only be downloaded if it is not present.
onepassword_desktop_force_update: false

# If true, forces the 1password CLI to be updated.
# If false, 1password desktop will only be downloaded if it is not present, even if the versions are different.
onepassword_cli_force_update: false

# The 1password CLI version to install. Leave blank to use latest.
# See https://app-updates.agilebits.com/product_history/CLI2
onepassword_cli_version: ""

# The URL to download the CLI from. Leave blank to automatically determine.
# This will override the `onepassword_cli_version` variable
onepassword_cli_download_url: ""
